# Secrets required:
#
# Registry (org-level):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token
#
# Deployment webhook (repo-level, optional - omit if no deploy target):
#   WEBHOOK_URL_DEV     - Portainer service webhook URL for dev redeploy

name: CI

on:
  push:
    branches: ['**']
    # Calver tags only: YYYY.N or YYYY.N.N (e.g. 2026.48.0) - no leading v
    tags: ['[0-9][0-9][0-9][0-9].[0-9]*']
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  IMAGE_NAME: scbd/solr-backup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logic:
      #   calver tag (YYYY.N.N) -> tags=<tag> + latest, push=true
      #   dev branch            -> tags=dev,            push=true (+ dev webhook)
      #   anything else         -> tags=build-<sha>,    push=false (build + test only)
      - name: Resolve image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ env.IMAGE_NAME }}"
          REF="${GITHUB_REF}"

          if [[ "${REF}" =~ ^refs/tags/[0-9]{4}\.[0-9]+(\.[0-9]+)*$ ]]; then
            TAG="${REF#refs/tags/}"
            echo "tags<<EOF"          >> $GITHUB_OUTPUT
            echo "${IMAGE}:${TAG}"    >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest"    >> $GITHUB_OUTPUT
            echo "EOF"                >> $GITHUB_OUTPUT
            echo "push=true"          >> $GITHUB_OUTPUT
            echo "branch="            >> $GITHUB_OUTPUT

          elif [[ "${REF}" == "refs/heads/dev" ]]; then
            echo "tags=${IMAGE}:dev" >> $GITHUB_OUTPUT
            echo "push=true"         >> $GITHUB_OUTPUT
            echo "branch=dev"        >> $GITHUB_OUTPUT

          else
            echo "tags=${IMAGE}:build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "push=false"                        >> $GITHUB_OUTPUT
            echo "branch="                           >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          build-args: COMMIT=${{ github.sha }}
          load: true
          tags: ci-build:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app has no HTTP port: it is a cron scheduler that backs up Solr
      # (via the Docker socket) to S3. Checks need no Solr, socket or AWS:
      #   1. npm test inside the image - Node version vs engines.node
      #      (CVE-2026-111497) and scheduler start-up; the backup cycle
      #      tests skip themselves without TEST_S3_ENDPOINT/SOLR_CONTAINER_NAME.
      #   2. Start the image with its default CMD, wait for the scheduler's
      #      "Next Schedule" log line, and fail if the container exits.
      - name: Test image
        run: |
          docker run --rm ci-build:local npm test

          docker run --name app -d -e CRON_TIME='0 0 1 1 *' ci-build:local
          trap 'docker logs app; docker rm -f app >/dev/null' EXIT
          for i in $(seq 1 15); do
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "Container exited"; exit 1
            fi
            if docker logs app 2>&1 | grep 'Next Schedule' >/dev/null; then
              sleep 3
              [ "$(docker inspect -f '{{.State.Running}}' app)" = "true" ] || { echo "Container exited"; exit 1; }
              echo "Scheduler started"; exit 0
            fi
            sleep 2
          done
          echo "Scheduler did not start within 30s"; exit 1

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker tag ci-build:local "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Portainer webhook - non-critical, a failed redeploy never blocks CI.
      - name: Deploy to Portainer (dev)
        if: steps.meta.outputs.branch == 'dev'
        continue-on-error: true
        uses: newarifrh/portainer-service-webhook@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL_DEV }}
